[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deal-intelligence"
version = "0.2.0"
description = "Quality-aware deal discovery and price intelligence for products worth buying."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Thomas Ma"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.10,<3",
  "jinja2>=3.1,<4",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "python-multipart>=0.0.18,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.8,<1"]

[project.scripts]
dealintel = "dealintel.cli:main"

[tool.setuptools.packages.find]
include = ["dealintel*"]

[tool.setuptools.package-data]
dealintel = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
